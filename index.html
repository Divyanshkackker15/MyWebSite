<!doctype html>
<html lang="en-IN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#070A12" />
    <meta name="color-scheme" content="dark" />
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <!--app-head-->
    <script>
      // Runs before first paint: skip the preloader if it already played in
      // this browser tab, or if the visitor prefers reduced motion.
      try {
        if (sessionStorage.getItem('dk-booted') || matchMedia('(prefers-reduced-motion: reduce)').matches)
          document.documentElement.classList.add('booted')
      } catch (e) {}
    </script>
    <noscript><style>.preloader{display:none!important}[style*="opacity:0"]{opacity:1!important;transform:none!important}</style></noscript>
  </head>
  <body>
    <div id="root"><!--app-html--></div>
    <script type="module" src="/src/entry-client.tsx"></script>
  </body>
</html>
