<!doctype html>
<html lang="en-IN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#000000" />
    <meta name="color-scheme" content="dark" />
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <!--app-head-->
    <script>
      // Before first paint: mark JS as available (enables reveal animations)
      // and decide whether the opening sequence plays on the home page:
      // once per browser tab, never with reduced motion.
      ;(function () {
        var c = document.documentElement.classList
        c.add('js')
        var skip = false
        try { skip = !!sessionStorage.getItem('dk-intro') } catch (e) {}
        if (skip || matchMedia('(prefers-reduced-motion: reduce)').matches) c.add('intro-skip')
        else c.add('intro-play')
        // if the app never starts (blocked script, old browser), show everything
        setTimeout(function () { if (!window.__dkReady) c.remove('js') }, 5000)
      })()
    </script>
  </head>
  <body>
    <div id="root"><!--app-html--></div>
    <script type="module" src="/src/entry-client.tsx"></script>
  </body>
</html>
